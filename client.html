<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSM Streaming TTS Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            margin-bottom: 20px;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.generating {
            background: #fff3cd;
            color: #856404;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .control-item {
            display: flex;
            flex-direction: column;
        }
        
        input[type="range"] {
            width: 100%;
            margin-top: 8px;
        }
        
        .slider-value {
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .stop-btn {
            background: #dc3545;
            color: white;
        }
        
        .stop-btn:hover:not(:disabled) {
            background: #c82333;
        }
        
        .clear-btn {
            background: #6c757d;
            color: white;
        }
        
        .clear-btn:hover:not(:disabled) {
            background: #5a6268;
        }
        
        .metrics {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .metrics h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.1em;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .metric-row:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: #666;
            font-weight: 500;
        }
        
        .metric-value {
            color: #667eea;
            font-weight: 600;
        }
        
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
        
        .log-entry.error {
            border-left-color: #dc3545;
            color: #ff6b6b;
        }
        
        .log-entry.success {
            border-left-color: #28a745;
            color: #51cf66;
        }
        
        audio {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #999;
            font-size: 0.85em;
        }
        
        .example-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .example-btn {
            padding: 8px 15px;
            background: #e9ecef;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .example-btn:hover {
            background: #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ CSM Streaming TTS</h1>
        <div class="subtitle">Real-time text-to-speech powered by CSM-1B</div>
        
        <div class="status disconnected" id="status">Disconnected</div>
        
        <div class="input-group">
            <label for="textInput">Enter text to generate:</label>
            <div class="example-buttons">
                <button class="example-btn" onclick="setExample('Hello! This is a test of the real-time streaming text to speech system.')">Example 1</button>
                <button class="example-btn" onclick="setExample('The quick brown fox jumps over the lazy dog. This sentence contains every letter of the alphabet.')">Example 2</button>
                <button class="example-btn" onclick="setExample('Welcome to the future of AI-powered voice synthesis. This system can generate natural-sounding speech in real-time.')">Example 3</button>
            </div>
            <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
        </div>
        
        <div class="controls">
            <div class="control-item">
                <label for="temperature">Temperature: <span class="slider-value" id="tempValue">1.0</span></label>
                <input type="range" id="temperature" min="0.1" max="2.0" step="0.1" value="1.0" oninput="updateSlider('temp', this.value)">
            </div>
            <div class="control-item">
                <label for="topk">Top-K: <span class="slider-value" id="topkValue">50</span></label>
                <input type="range" id="topk" min="10" max="100" step="10" value="50" oninput="updateSlider('topk', this.value)">
            </div>
        </div>
        
        <div class="buttons">
            <button class="generate-btn" id="generateBtn" onclick="generate()">Generate Speech</button>
            <button class="stop-btn" id="stopBtn" onclick="stopGeneration()" disabled>Stop</button>
            <button class="clear-btn" onclick="clearAll()">Clear</button>
        </div>
        
        <div class="metrics" id="metricsPanel" style="display: none;">
            <h3>Performance Metrics</h3>
            <div class="metric-row">
                <span class="metric-label">First Chunk Latency:</span>
                <span class="metric-value" id="firstChunkLatency">-</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Chunks Received:</span>
                <span class="metric-value" id="chunksReceived">0</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Total Time:</span>
                <span class="metric-value" id="totalTime">-</span>
            </div>
        </div>
        
        <div class="log" id="log"></div>
        
        <audio id="audioPlayer" controls style="display: none;"></audio>
        
        <div class="footer">
            Optimized for real-time streaming • RTF: 0.78-0.87x
        </div>
    </div>

    <script>
        let ws = null;
        let isGenerating = false;
        let audioChunks = [];
        let sampleRate = 24000;
        let audioContext = null;
        let nextStartTime = 0;
        let audioQueue = [];
        let isPlaying = false;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(status, text) {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${status}`;
            statusEl.textContent = text;
        }
        
        function updateSlider(type, value) {
            if (type === 'temp') {
                document.getElementById('tempValue').textContent = value;
            } else if (type === 'topk') {
                document.getElementById('topkValue').textContent = value;
            }
        }
        
        function setExample(text) {
            document.getElementById('textInput').value = text;
        }
        
        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('log').innerHTML = '';
            document.getElementById('metricsPanel').style.display = 'none';
            audioChunks = [];
        }
        
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/generate`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                updateStatus('connected', 'Connected');
                log('Connected to server', 'success');
            };
            
            ws.onclose = () => {
                updateStatus('disconnected', 'Disconnected');
                log('Disconnected from server', 'error');
                setTimeout(initWebSocket, 3000);
            };
            
            ws.onerror = (error) => {
                log('WebSocket error: ' + error, 'error');
            };
            
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'start') {
                    log(`Starting generation: ${data.text.substring(0, 50)}...`);
                    sampleRate = data.sample_rate;
                    audioChunks = [];
                    document.getElementById('metricsPanel').style.display = 'block';
                    document.getElementById('chunksReceived').textContent = '0';
                    
                    // Initialize Web Audio API
                    if (!audioContext || audioContext.state === 'closed') {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)({
                            sampleRate: sampleRate
                        });
                    }
                    
                    // Resume if suspended
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }
                    
                    // Reset playback state
                    audioQueue = [];
                    nextStartTime = 0; // Will be set when first chunk arrives
                    
                } else if (data.type === 'audio_chunk') {
                    // Decode base64 WAV data
                    const wavBytes = Uint8Array.from(atob(data.data), c => c.charCodeAt(0));
                    
                    // Store for later download
                    audioChunks.push(wavBytes);
                    
                    // Log chunk info
                    console.log(`Chunk ${data.chunk_id} received: ${wavBytes.length} bytes`);
                    log(`Chunk ${data.chunk_id} received (${(wavBytes.length/1024).toFixed(1)}KB)`);
                    
                    // Play chunk immediately
                    playAudioChunk(wavBytes, data.chunk_id);
                    
                    // Update metrics
                    document.getElementById('chunksReceived').textContent = data.chunk_id;
                    
                    if (data.chunk_id === 1) {
                        log('First chunk playing!', 'success');
                    }
                    
                } else if (data.type === 'complete') {
                    isGenerating = false;
                    updateStatus('connected', 'Connected');
                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    
                    // Update final metrics
                    if (data.first_chunk_latency) {
                        document.getElementById('firstChunkLatency').textContent = 
                            `${(data.first_chunk_latency * 1000).toFixed(0)}ms`;
                    }
                    document.getElementById('totalTime').textContent = 
                        `${data.total_time.toFixed(2)}s`;
                    
                    log(`Generation complete: ${data.chunks} chunks in ${data.total_time.toFixed(2)}s`, 'success');
                    
                    // Create downloadable audio
                    createDownloadableAudio();
                    
                } else if (data.type === 'error') {
                    log('Error: ' + data.error, 'error');
                    isGenerating = false;
                    updateStatus('connected', 'Connected');
                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                }
            };
        }
        
        async function playAudioChunk(wavBytes, chunkId) {
            try {
                // Decode WAV file
                const audioBuffer = await audioContext.decodeAudioData(wavBytes.buffer.slice(0));
                
                // Create buffer source
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                
                // Calculate start time
                const currentTime = audioContext.currentTime;
                
                if (nextStartTime === 0 || nextStartTime < currentTime) {
                    // First chunk or we fell behind - start immediately with small buffer
                    nextStartTime = currentTime + 0.05; // 50ms buffer for safety
                }
                
                // Schedule playback
                source.start(nextStartTime);
                console.log(`Chunk ${chunkId} playing at ${nextStartTime.toFixed(2)}s (now: ${currentTime.toFixed(2)}s), duration ${audioBuffer.duration.toFixed(2)}s`);
                
                // Update next start time for seamless playback
                nextStartTime = nextStartTime + audioBuffer.duration;
                
            } catch (error) {
                console.error(`Error playing chunk ${chunkId}:`, error);
                log(`Error playing chunk ${chunkId}`, 'error');
            }
        }
        
        function createDownloadableAudio() {
            // Combine all WAV chunks for download
            if (audioChunks.length > 0) {
                // Note: We're not combining chunks properly here, just offering the last one
                // For proper combination, we'd need to merge WAV files
                const lastChunk = audioChunks[audioChunks.length - 1];
                const blob = new Blob([lastChunk], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                
                const audioPlayer = document.getElementById('audioPlayer');
                audioPlayer.src = url;
                audioPlayer.style.display = 'block';
                // Don't auto-load or play - user already heard it streaming
                // audioPlayer.load(); // Commented out to prevent auto-playing
            }
        }
        
        function generate() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('Please enter some text to generate');
                return;
            }
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Not connected to server');
                return;
            }
            
            isGenerating = true;
            updateStatus('generating', 'Generating...');
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            const temperature = parseFloat(document.getElementById('temperature').value);
            const topk = parseInt(document.getElementById('topk').value);
            
            ws.send(JSON.stringify({
                text: text,
                temperature: temperature,
                topk: topk
            }));
        }
        
        function stopGeneration() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
                initWebSocket();
            }
            isGenerating = false;
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            updateStatus('connected', 'Connected');
            log('Generation stopped by user');
        }
        
        // Initialize on page load
        window.onload = () => {
            initWebSocket();
            log('Client initialized');
        };
    </script>
</body>
</html>
